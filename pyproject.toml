[project]
name = "frutify-is01"
version = "0.1.0"
description = "Estacao de demonstracao Frutify IS-01 — preview ao vivo + analise sob demanda"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "opencv-python>=4.10",
    "numpy>=1.26",
    "pillow>=10.4",
    "python-dotenv>=1.0",
    "pydantic>=2.9",
    "ultralytics>=8.4.123",
    "onnxruntime>=1.20",
]

[project.scripts]
frutify = "frutify.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["frutify"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
